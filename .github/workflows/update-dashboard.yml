# dashboard/data/ の JSON を定期的に自動更新するワークフロー
# vibes export-data --dashboard を実行し、変更があればコミット・プッシュする
name: Update Dashboard Data

on:
  schedule:
    # 5 分ごとに実行
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run export-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash src/scripts/vibes.sh export-data --dashboard

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet dashboard/data/; then
            echo "No changes to commit."
            exit 0
          fi

          git add dashboard/data/
          git commit -m "chore(dashboard): auto-update dashboard/data [skip ci]"
          git push
